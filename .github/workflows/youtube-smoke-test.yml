name: YouTube no-cookie download smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Test the provided YouTube video without cookies
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import yt_dlp

          url = "https://youtu.be/zUkKSOyGHQU"
          work = Path("/tmp/youtube-smoke-test")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True, exist_ok=True)

          profiles = [
              ("default", None),
              ("tv", ["tv"]),
              ("android_vr", ["android_vr"]),
              ("web_safari", ["web_safari"]),
              ("tv+web_safari", ["tv", "web_safari"]),
          ]
          results = []
          succeeded = False

          for name, clients in profiles:
              outtmpl = str(work / f"{name}-%(id)s.%(ext)s")
              options = {
                  "format": "worst[ext=mp4]/worst",
                  "outtmpl": outtmpl,
                  "noplaylist": True,
                  "quiet": True,
                  "no_warnings": False,
                  "retries": 1,
                  "fragment_retries": 1,
                  "socket_timeout": 20,
                  "overwrites": True,
              }
              if clients:
                  options["extractor_args"] = {"youtube": {"player_client": clients}}

              try:
                  print(f"\n=== TRY: {name} ===", flush=True)
                  with yt_dlp.YoutubeDL(options) as downloader:
                      downloader.download([url])
                  files = [
                      p for p in work.glob(f"{name}-*")
                      if p.is_file() and p.stat().st_size > 100_000
                      and not p.name.endswith((".part", ".ytdl"))
                  ]
                  if files:
                      results.append((name, "PASS", f"{files[0].stat().st_size // 1024} KiB downloaded"))
                      succeeded = True
                      print(f"PASS {name}: video file downloaded", flush=True)
                      break
                  results.append((name, "FAIL", "no complete video file"))
              except Exception as exc:
                  message = " ".join(str(exc).split())[:220]
                  results.append((name, "FAIL", message))
                  print(f"FAIL {name}: {message}", flush=True)

          summary = ["## YouTube no-cookie download test", "", f"Video: {url}", "", "| Player profile | Result | Details |", "|---|---|---|"]
          summary += [f"| {name} | {status} | {details.replace('|', '/')} |" for name, status, details in results]
          summary += ["", f"Overall: **{'PASS' if succeeded else 'FAIL'}**", "", "This is a live download test from a GitHub-hosted runner. No user cookies or login credentials were used."]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(summary) + "\n")
          shutil.rmtree(work, ignore_errors=True)
          if not succeeded:
              raise SystemExit("All no-cookie player profiles failed. Check the profile errors above.")
          PY
